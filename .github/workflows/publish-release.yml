name: Publish NalApps Child Theme release

on:
  push:
    branches: [main]
    paths:
      - 'release/release.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-nalapps-childtheme-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release manifest
        run: |
          set -euo pipefail
          test -f release/release.json
          jq -e '
            .product_id == "nalapps-childtheme" and
            (.version | type == "string") and
            (.tag | type == "string") and
            (.asset | type == "string") and
            (.payload | type == "string") and
            (.sha256 | test("^[a-f0-9]{64}$"))
          ' release/release.json >/dev/null

      - name: Build and validate package
        run: |
          set -euo pipefail
          version=$(jq -r '.version' release/release.json)
          asset=$(jq -r '.asset' release/release.json)
          payload=$(jq -r '.payload' release/release.json)
          expected=$(jq -r '.sha256' release/release.json)
          folder=$(jq -r '.plugin_folder' release/release.json)
          main_file=$(jq -r '.main_file' release/release.json)

          test -f "$payload"
          base64 --decode "$payload" > "$asset"
          echo "$expected  $asset" | sha256sum --check --strict
          unzip -t "$asset"
          test "$(unzip -Z1 "$asset" | cut -d/ -f1 | sort -u)" = "$folder"
          unzip -p "$asset" "$folder/$main_file" | grep -Eq "^[[:space:]]*\\*[[:space:]]*Version:[[:space:]]*${version}[[:space:]]*$"

          echo "$expected  $asset" > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(jq -r '.tag' release/release.json)
          version=$(jq -r '.version' release/release.json)
          asset=$(jq -r '.asset' release/release.json)
          title=$(jq -r '.title' release/release.json)
          notes=$(jq -r '.notes' release/release.json)

          printf '%s\n' "$notes" > RELEASE_NOTES.md

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" SHA256SUMS.txt --clobber
            gh release edit "$tag" --title "$title $version" --notes-file RELEASE_NOTES.md --latest
          else
            gh release create "$tag" "$asset" SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "$title $version" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
